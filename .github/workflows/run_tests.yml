name: run_tests
on: [push]
permissions:
  contents: read
jobs:
  run_tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js 22
      uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: 'yarn'
    - run: yarn install --frozen-lockfile
    - run: yarn test
    - run: yarn build
